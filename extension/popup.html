<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I Have 2 Much Tabs</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-2: #232733;
        --border: #2e3345;
        --text: #e4e6ed;
        --text-muted: #8b8fa3;
        --accent: #6c8cff;
        --accent-hover: #8ba3ff;
        --green: #34d399;
        --red: #f87171;
        --yellow: #fbbf24;
        --input-bg: #141722;
        --radius: 10px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 380px;
        background: var(--bg);
        color: var(--text);
      }
      .shell { padding: 14px; }
      .header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 14px;
      }
      .header h1 { font-size: 15px; font-weight: 700; }
      .pill {
        font-size: 10px; color: var(--text-muted);
        border: 1px solid var(--border); padding: 2px 8px;
        border-radius: 999px; background: var(--surface);
      }
      select, input {
        width: 100%; margin-top: 8px; padding: 9px 12px;
        border-radius: var(--radius); border: 1px solid var(--border);
        background: var(--input-bg); color: var(--text);
        font-size: 13px; outline: none; transition: border-color .15s;
      }
      select:focus, input:focus { border-color: var(--accent); }
      option { background: var(--surface); }
      button {
        width: 100%; margin-top: 8px; padding: 9px 12px;
        border-radius: var(--radius); border: 1px solid var(--border);
        background: var(--surface); color: var(--text);
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all .15s;
      }
      button:hover { background: var(--surface-2); border-color: var(--accent); }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.primary:hover { background: var(--accent-hover); }
      button.secondary { background: var(--surface-2); color: var(--accent); border-color: var(--border); }
      button.warn { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.3); }
      button.warn:hover { background: rgba(248,113,113,0.2); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .bar {
        height: 6px; background: var(--surface-2); border-radius: 999px;
        overflow: hidden; margin-top: 10px; border: 1px solid var(--border);
      }
      .bar > div {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--green));
        transition: width .25s ease;
      }
      .status {
        font-size: 12px; color: var(--text-muted);
        white-space: pre-wrap; margin-top: 10px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px; line-height: 1.4;
      }
      .muted { color: var(--text-muted); font-size: 11px; margin-top: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <h1>I Have 2 Much Tabs</h1>
        <span class="pill">v0.1.15</span>
      </div>
      <select id="scanScope">
        <option value="all_tabs">All Open Tabs</option>
        <option value="current_window">Current Window Tabs</option>
      </select>
      <button id="scanBtn" class="primary">Start Scan</button>
      <div class="grid" style="margin-top:8px;">
        <button id="openDashboardBtn" class="secondary">Open Dashboard</button>
        <button id="statsBtn">Refresh Status</button>
        <button id="exportTxtBtn">Export TXT</button>
        <button id="closeAnalyzedBtn" class="warn">Close Analyzed</button>
      </div>
      <input id="questionInput" placeholder="Ask your tab archive..." />
      <button id="askBtn" class="secondary">Ask</button>
      <div class="bar"><div id="progressBarFill"></div></div>
      <div class="status" id="statusBox">Idle</div>
      <div class="status" id="answerBox">Ask a question to see answer here.</div>
      <div class="muted">Live status auto-refreshes while popup is open.</div>
    </div>
    <script type="module" src="./dist/popup/index.js"></script>
  </body>
</html>
