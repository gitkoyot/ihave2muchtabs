<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - I Have 2 Much Tabs</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-2: #232733;
        --border: #2e3345;
        --text: #e4e6ed;
        --text-muted: #8b8fa3;
        --accent: #6c8cff;
        --accent-hover: #8ba3ff;
        --green: #34d399;
        --red: #f87171;
        --yellow: #fbbf24;
        --input-bg: #141722;
        --radius: 10px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap { padding: 24px; }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
      .toolbar {
        display: grid;
        grid-template-columns: 1.2fr repeat(7, auto);
        gap: 8px;
        align-items: center;
      }
      input {
        padding: 10px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        width: 100%;
        font-size: 13px;
        outline: none;
        transition: border-color .15s;
      }
      input:focus { border-color: var(--accent); }
      button {
        padding: 10px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        transition: all .15s;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      #exportBtn, #exportTxtBtn { color: var(--accent); }
      #clearDbBtn { color: var(--red); border-color: rgba(248,113,113,0.3); }
      #clearDbBtn:hover { background: rgba(248,113,113,0.1); }
      .muted { color: var(--text-muted); font-size: 12px; }
      #costPanel {
        background: var(--surface-2);
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-top: 12px;
        color: var(--text-muted);
        font-size: 12px;
      }
      #logsPanel {
        background: var(--input-bg);
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-top: 12px;
        color: var(--text-muted);
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }
      .table-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: auto;
        max-height: 65vh;
        background: var(--surface-2);
        margin-top: 12px;
      }
      table { width: 100%; border-collapse: separate; border-spacing: 0; }
      th, td {
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 1;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        font-weight: 600;
      }
      tbody tr { transition: background .1s; }
      tbody tr:hover { background: rgba(108,140,255,0.05); }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .status-done { background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.3); color: var(--green); }
      .status-failed { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: var(--red); }
      .status-restricted { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); color: var(--yellow); }
      .status-processing { background: rgba(108,140,255,0.1); border-color: rgba(108,140,255,0.3); color: var(--accent); }
      .status-pending { background: var(--surface-2); color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>Knowledge Dashboard</h1>
        <div class="toolbar">
          <input id="searchInput" placeholder="Search by URL, title, tag..." />
          <button id="settingsBtn">Settings</button>
          <button id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export JSONL</button>
          <button id="exportTxtBtn">Export TXT</button>
          <button id="clearDbBtn">Clear DB</button>
          <button id="logsBtn">Load Logs</button>
          <button id="clearLogsBtn">Clear Logs</button>
        </div>
        <p class="muted" id="statsLine" style="margin-top:10px;">Loading...</p>
        <div id="costPanel"></div>
        <pre id="logsPanel" class="muted"></pre>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Tab</th>
                <th>Detailed Summary / Links</th>
                <th>Diagnostics</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
